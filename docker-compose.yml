# Lokal ishga tushirish: docker compose up --build
# Birinchi marta: docker compose exec api python manage.py seed_demo --flush
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migration
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: migration
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://migration:migration@db:5432/migration
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: docker-dev-key-change-me
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,api
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"

volumes:
  pgdata:
